<div *ngIf="aiData">

  <h2>AI Travel Companion</h2>
  <p *ngIf="errorMessage">{{ errorMessage }}</p>

  <h3>Places</h3>
  <div *ngFor="let p of aiData.places">
    <img *ngIf="p.image" [src]="p.image" width="200">
    <p>{{p.name}}</p>
  </div>

  <h3>Food</h3>
  <div *ngFor="let f of aiData.food">
    <img *ngIf="f.image" [src]="f.image" width="200">
    <p>{{f.dish}}</p>
  </div>

</div>
